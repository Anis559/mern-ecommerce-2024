services:
  # Backend (Node.js Express Server)
  - type: web
    name: myshop-server
    runtime: node
    rootDir: server
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend (Vite Static Site)
  - type: static
    name: myshop-client
    rootDir: client
    buildCommand: "npm install && npm run build"
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: myshop-server
          property: url
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
